   </g>
   <g id="text_2">
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(65.501719 71.356898)">Frozen SigLIP2 whole screen</text>
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(64.832266 85.764062)">16×16 grid · 1,152 channels</text>
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(75.184297 100.171227)">channel PCA → 256×512</text>
   </g>
   <g id="text_3">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(363.814805 71.873801)">Event encoder → aₜ ∈ ℝ³⁸⁴</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(334.647773 85.626094)">type + Fourier coords + scroll + keys</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(340.184062 99.378387)">Qwen3-Embedding-0.6B typed text</text>
   </g>
   <g id="text_4">
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(686.816406 66.60623)">Previous state</text>
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(696.262656 81.013395)">hₜ₋₁ ∈ ℝ⁵¹²</text>
   </g>
   <g id="text_5">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(79.740117 175.477301)">LayerNorm → linear K, V</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(70.833164 189.229594)">learned position added to K</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(62.834297 202.981887)">256×384 each; token drop 0.4</text>
   </g>
   <g id="text_6">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(344.820117 179.462051)">8 action queries × 384</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(351.091406 193.214344)">learned base + Wₐaₜ</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(348.23918 206.966637)">+ Wₚaₜ₋₁ (sum mode)</text>
   </g>
   <g id="text_7">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(584.252461 179.462051)">4 static</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(562.670859 193.214344)">learned queries</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(585.914414 206.966637)">4×384</text>
   </g>
   <g id="text_8">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(718.510937 179.978953)">4 history queries</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(744.359375 193.076375)">Wₕhₜ₋₁</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(743.697656 206.173797)">4×384</text>
   </g>
   <g id="text_9">
    <text style="fill: #c76725; font: 9px 'DejaVu Sans'; text-anchor: middle" x="540.9" y="134.5305" transform="rotate(-0 540.9 134.5305)">aₜ₋₁ is stored</text>
   </g>
   <g id="text_10">
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(339.898984 289.75223)">Cross-attention: 16 queries, 8 heads × 48 channels</text>
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(342.257109 304.159395)">concatenate 16 outputs (6,144) → linear → fₜ (384)</text>
   </g>
   <g id="text_11">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(144.026719 380.691926)">Fusion [fₜ ; aₜ] (768)</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(104.868281 394.444219)">Linear 768→768 · GELU · 768→384</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(152.353711 408.196512)">Dropout 0.3 → zₜ</text>
   </g>
   <g id="text_12">
    <text style="fill: #c76725; font: 9px 'DejaVu Sans'; text-anchor: start" x="108.45" y="333.768" transform="rotate(-0 108.45 333.768)">aₜ bypass</text>
   </g>
   <g id="text_13">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(482.608242 380.691926)">GRU cell: input 384, state 512</text>
