    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(468.910664 408.196512)">learned h₀; freeze state on padding</text>
   </g>
   <g id="text_14">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'; text-anchor: middle" x="561.825" y="469.2495" transform="rotate(-0 561.825 469.2495)">Training dropout 0.3 before both heads</text>
   </g>
   <g id="text_15">
    <text style="fill: #2266a3; font: 12px 'DejaVu Sans'; text-anchor: middle" x="185.175" y="501.1275" transform="rotate(-0 185.175 501.1275)">dₜ = normalize(Linear 512→3,072)</text>
   </g>
   <g id="text_16">
    <text style="fill: #137d79; font: 11.5px 'DejaVu Sans'; text-anchor: middle" x="624.6" y="501.1275" transform="rotate(-0 624.6 501.1275)">κₜ = min(50, 1 + softplus(Linear 512→1))</text>
