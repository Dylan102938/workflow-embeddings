   <g id="text_1">
    <text style="fill: #233448; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="26.424" y="24.77088" transform="rotate(-0 26.424 24.77088)">One session, one retained step: all training instructions are candidates</text>
   </g>
   <g id="text_2">
    <text style="fill: #637181; font: 10px 'DejaVu Sans'; text-anchor: start" x="26.424" y="42.23448" transform="rotate(-0 26.424 42.23448)">Frozen normalized keys: OpenAI text-embedding-3-large (3,072 dimensions)</text>
   </g>
   <g id="text_3">
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(83.110453 74.73977)">Model emits dₜ, κₜ</text>
    <text style="fill: #233448; font: 11px 'DejaVu Sans'" transform="translate(85.770219 89.146935)">logit j = κₜ dₜ · u′ⱼ</text>
   </g>
   <g id="text_4">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(370.089984 74.929237)">For EVERY candidate column, draw one wording uniformly</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(330.591937 88.68153)">original instruction or a retained paraphrase; redraw each optimizer step</text>
   </g>
   <g id="text_5">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(75.599688 176.407584)">other</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(68.314531 189.505006)">κₜ dₜ · u′ⱼ</text>
   </g>
   <g id="text_6">
    <text style="fill: #2266a3; font: 10px 'DejaVu Sans'; text-anchor: middle" x="88.92" y="237.8268" transform="rotate(-0 88.92 237.8268)">share of 0.2</text>
   </g>
   <g id="text_7">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(186.858875 176.407584)">true target</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(193.306531 189.505006)">κₜ dₜ · u′ⱼ</text>
   </g>
   <g id="text_8">
    <text style="fill: #137d79; font: 10px 'DejaVu Sans'; text-anchor: middle" x="213.912" y="237.8268" transform="rotate(-0 213.912 237.8268)">q = 0.8</text>
   </g>
   <g id="text_9">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(309.179781 176.407584)">same group</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(305.554781 189.505006)">−∞ (masked)</text>
   </g>
   <g id="text_10">
    <text style="fill: #637181; font: 10px 'DejaVu Sans'; text-anchor: middle" x="338.904" y="237.8268" transform="rotate(-0 338.904 237.8268)">q = 0</text>
   </g>
   <g id="text_11">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(432.528813 176.407584)">cosine &gt; 0.8</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(430.546781 189.505006)">−∞ (masked)</text>
   </g>
   <g id="text_12">
    <text style="fill: #637181; font: 10px 'DejaVu Sans'; text-anchor: middle" x="463.896" y="237.8268" transform="rotate(-0 463.896 237.8268)">q = 0</text>
   </g>
   <g id="text_13">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(572.126281 176.407584)">similar</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(568.282531 189.505006)">κₜ dₜ · u′ⱼ</text>
   </g>
   <g id="text_14">
    <text style="fill: #2266a3; font: 10px 'DejaVu Sans'; text-anchor: middle" x="588.888" y="237.8268" transform="rotate(-0 588.888 237.8268)">share of 0.2</text>
   </g>
   <g id="text_15">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(700.559687 176.407584)">other</text>
    <text style="fill: #233448; font: 10px 'DejaVu Sans'" transform="translate(693.274531 189.505006)">κₜ dₜ · u′ⱼ</text>
   </g>
   <g id="text_16">
    <text style="fill: #2266a3; font: 10px 'DejaVu Sans'; text-anchor: middle" x="713.88" y="237.8268" transform="rotate(-0 713.88 237.8268)">share of 0.2</text>
   </g>
   <g id="text_17">
    <text style="fill: #233448; font: 10px 'DejaVu Sans'; text-anchor: middle" x="401.4" y="272.754" transform="rotate(-0 401.4 272.754)">Mask and smoothing use ORIGINAL keys u, not the sampled wordings u′. The target is never masked.</text>
   </g>
   <g id="text_18">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(120.238055 312.543491)">Other unmasked columns share 0.2</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(116.256258 326.295784)">in proportion to exp(cos(uᵢ, uⱼ) / 0.05)</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(108.889852 340.048077)">exclude the target from this distribution</text>
   </g>
   <g id="text_19">
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(482.82307 312.543491)">Softmax over unmasked logits → −Σⱼ qⱼ log pⱼ</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(508.594828 326.295784)">Average steps within each session,</text>
    <text style="fill: #233448; font: 10.5px 'DejaVu Sans'" transform="translate(541.664086 340.048077)">then average sessions</text>
   </g>
   <g id="text_20">
    <text style="fill: #637181; font: 10px 'DejaVu Sans'; text-anchor: middle" x="401.4" y="377.5356" transform="rotate(-0 401.4 377.5356)">Schematic columns only; actual training has 18,081 candidate columns. No measured logits are depicted.</text>
   </g>
  </g>
 </g>
