[project]
name = "wfemb"
version = "0.1.0"
description = "Recurrent session-embedding model for computer-use workflows (AgentNet)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.5.1",
    "transformers==4.53.2",
    "sentence-transformers==4.1.0",
    "numpy>=1.26,<2.3",
    "pillow>=10.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "openai>=1.40",
    "einops>=0.8",
    "chz==0.4.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.14.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfemb"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["results", "legacy_runs", "dashboard/bundles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",   # chz entry points declare config defaults in the signature
    "B905",   # zip() without strict=
]

[tool.ruff.lint.isort]
known-first-party = ["wfemb"]
