[project]
name = "wfemb"
version = "0.1.0"
description = "Recurrent session-embedding model for computer-use workflows (AgentNet)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.5.1",
    "transformers==4.53.2",
    "sentence-transformers==4.1.0",
    "numpy>=1.26,<2.3",
    "pillow>=10.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "openai>=1.40",
    "einops>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfemb"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
